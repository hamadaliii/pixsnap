name: Keepalive

# Supabase free tier pausar projektet efter 7 dagars inaktivitet, och Render free
# spinner ner efter ~15 min. Denna cron pingar backend var 6:e timme, vilket i sin
# tur gör en läsning mot Supabase — båda hålls vid liv. Kostar ingenting.

on:
  schedule:
    # Var 6:e timme (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:        # gör att du kan trigga manuellt från Actions-fliken

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PixSnap backend
        run: |
          echo "Pingar backend (Render kan behöva ~50s på kallstart)..."
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -m 90 -w "\n%{http_code}" https://pixsnap-71ge.onrender.com/keepalive || true)
            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Försök $i → HTTP $CODE"
            echo "$BODY"
            if [ "$CODE" = "200" ]; then
              echo "Backend + Supabase är vakna."
              exit 0
            fi
            echo "Väntar 30s och försöker igen..."
            sleep 30
          done
          echo "Kunde inte nå backend efter 5 försök."
          exit 1
